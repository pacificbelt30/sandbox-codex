name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
      publish:
        description: Publish after uploading all assets
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Prepare Python
        run: uv python install 3.12

      - name: Verify release source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(head -n 1 doc/release-notes.md)" = "# Oaiso $RELEASE_TAG"
          bash -n install.sh scripts/install.sh
          make test vet
          uv run --no-project --no-config --managed-python --python 3.12 python -m unittest discover -s scripts -p 'test_*.py'
          uv run --no-project --no-config --managed-python --python 3.12 python -m unittest discover -s deploy/kata -p 'test_*.py'

      - name: Build and package
        run: |
          make node-bundle VERSION="$RELEASE_TAG"
          uv run --no-project --no-config --managed-python --python 3.12 python scripts/package-release.py --bundle dist/node-bundle --output dist/release --version "$RELEASE_TAG"
          cd dist/release
          sha256sum --check SHA256SUMS

      - name: Upload complete release, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/oaiso-release-state.json 2>/dev/null; then
            uv run --no-project --no-config --managed-python --python 3.12 python -c 'import json; assert json.load(open("/tmp/oaiso-release-state.json"))["isDraft"], "published releases must not be overwritten"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Oaiso $RELEASE_TAG" --notes-file doc/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/oaiso-linux-amd64.tar.gz dist/release/install.sh dist/release/SHA256SUMS --clobber
          if [ "$PUBLISH" = true ]; then
            release_base=${RELEASE_TAG%%+*}
            case "$release_base" in
              *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease ;;
              *) gh release edit "$RELEASE_TAG" --draft=false --latest ;;
            esac
          fi
