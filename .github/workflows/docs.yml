name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Prepare managed Python
        run: uv python install 3.12

      - name: Deploy to GitHub Pages
        run: uv run --no-project --no-config --managed-python --python 3.12 --with-requirements requirements-docs.txt mkdocs gh-deploy --strict --force
