name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout=5m

  # ── Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          go build -v -o cxd .
          ln -s cxd codex-dock
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o codex-dock-worker-guard ./cmd/worker-guard
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o codex-dock-io-logger ./cmd/io-logger

      - name: Verify binary runs
        run: |
          ./cxd --help
          ./codex-dock --help

      - name: Cross-compile (macOS arm64)
        run: GOOS=darwin GOARCH=arm64 go build -o cxd-darwin-arm64 .

      - name: Cross-compile (macOS amd64)
        run: GOOS=darwin GOARCH=amd64 go build -o cxd-darwin-amd64 .

      - name: Cross-compile (Linux arm64)
        run: GOOS=linux GOARCH=arm64 go build -o cxd-linux-arm64 .

  # ── Test ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Kata profile and transactional setup
        run: python3 -m unittest discover -s deploy/kata -p 'test_*.py'

      - name: Test install script
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run tests
        run: |
          make test

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ── Vet ─────────────────────────────────────────────────────────────────
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ── Docker build ─────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: docker/sandbox
          file: docker/sandbox/Dockerfile
          push: false
          tags: codex-dock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/proxy/Dockerfile
          push: false
          tags: codex-dock-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
