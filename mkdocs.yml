site_name: cxd ドキュメント
site_description: AI サンドボックスコンテナマネージャー cxd の公式ドキュメント
site_url: https://pacificbelt30.github.io/sandbox-codex/
repo_name: pacificbelt30/sandbox-codex
repo_url: https://github.com/pacificbelt30/sandbox-codex

docs_dir: doc

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

plugins:
  - search:
      lang:
        - ja
        - en

nav:
  - ホーム: index.md
  - はじめに:
      - クイックスタート: getting-started.md
      - Claude Code: claude-code.md
      - 導入と更新の自動化: setup.md
      - 実行ホストの手動準備: kata.md
      - 旧環境からの移行: migration.md
  - 運用:
      - 日常の操作と更新: operations.md
      - ファイル共有と所有者: workspace.md
      - Kata VMの管理: vm.md
      - 通信の許可・拒否: proxy-policy.md
      - 追加のサンドボックス制御: sandbox-features.md
      - トラブルシューティング: troubleshooting.md
  - リファレンス:
      - コマンド一覧: commands.md
      - シェル補完: commands/completion.md
      - ワーカー起動: commands/run.md
      - ワーカー管理: commands/worker.md
      - イメージの作成: commands/build.md
      - プロキシ管理: commands/proxy.md
      - 認証管理: commands/auth.md
      - ネットワーク管理: commands/network-cmd.md
      - TUI: commands/ui.md
      - CLIの更新: commands/update.md
      - 設定: configuration.md
      - 製品組み込み用 Go API: go-api.md
      - ケース別の認証: credential-store.md
      - 認証API: auth-proxy/endpoints.md
  - 仕組みと開発:
      - アーキテクチャ: architecture.md
      - 認証プロキシ: auth-proxy.md
      - 短命トークン: auth-proxy/tokens.md
      - プロキシの単体利用: proxy-standalone.md
      - ネットワーク: network.md
      - セキュリティ: security.md
      - 性能とベンチマーク: performance.md
      - 上流仕様の変更検知: upstream-compatibility.md
      - 今後の対応: future-work.md
      - テストと動作確認: testing.md
      - 廃止したfirewall機能: firewall.md
      - 旧firewallコマンド: commands/firewall.md
  - English:
      - Home: en/index.md
      - Quick start: en/getting-started.md
      - Claude Code: en/claude-code.md
      - Commands:
          - Overview: en/commands.md
          - Completion: en/commands/completion.md
          - Run: en/commands/run.md
          - Workers: en/commands/worker.md
          - Build: en/commands/build.md
          - Proxy: en/commands/proxy.md
          - Auth: en/commands/auth.md
          - Network: en/commands/network-cmd.md
          - TUI: en/commands/ui.md
          - Update: en/commands/update.md
      - Configuration: en/configuration.md
      - Go API: en/go-api.md
      - Additional sandbox controls: en/sandbox-features.md
      - Case credentials: en/credential-store.md
      - Architecture: en/architecture.md
      - Auth proxy: en/auth-proxy.md
      - Auth API: en/auth-proxy/endpoints.md
      - Tokens: en/auth-proxy/tokens.md
      - Standalone proxy: en/proxy-standalone.md
      - Network: en/network.md
      - Security: en/security.md
      - Performance and benchmarks: en/performance.md
      - Upstream compatibility: en/upstream-compatibility.md
      - Future work: en/future-work.md
      - Removed firewall: en/firewall.md
      - Removed firewall command: en/commands/firewall.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
